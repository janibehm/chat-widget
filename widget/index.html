<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chat-widget - kehitysdemo</title>
  <style>
    /* Tarkoituksella aggressiivisia tyylejä: jos widget näyttää oikealta
       tämän seassa, Shadow DOM -eristys toimii. */
    * { font-family: "Comic Sans MS", cursive; }
    body { margin: 0; padding: 40px; background: #fdf2f8; color: #be185d; }
    button { background: lime !important; border: 5px dashed red !important; font-size: 30px !important; }
    input { border: 5px solid orange !important; }
    div { line-height: 4 !important; }
  </style>
</head>
<body>
  <h1>Isäntäsivu</h1>
  <p>Tällä sivulla on rumia globaaleja tyylejä. Widgetin pitää näyttää silti oikealta.</p>
  <button>Isäntäsivun nappi</button>

  <script
    type="module"
    src="/src/index.tsx"
    data-bot-id="cusco"
    data-api-url="http://localhost:8787"
    data-color="#4F46E5"
    data-position="bottom-right"
    data-title="Kysy Cuscolta"
  ></script>
</body>
</html>
